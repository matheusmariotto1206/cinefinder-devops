trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  vmHost: '172.171.193.127'
  vmDeployPath: '/home/azureuser/cinefinder-devops'

stages:
  - stage: CI
    displayName: 'CI - Build e Testes'
    jobs:
      - job: BuildTest
        displayName: 'Gradle test + build'
        steps:
          - checkout: self

          - task: JavaToolInstaller@0
            displayName: 'Java 17'
            inputs:
              versionSpec: '17'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - script: |
              chmod +x gradlew
              unset SPRING_DATASOURCE_URL SPRING_DATASOURCE_USERNAME SPRING_DATASOURCE_PASSWORD
              export SPRING_PROFILES_ACTIVE=dev
              ./gradlew test build --no-daemon
            displayName: 'Testes e build (profile dev/H2 no CI)'

          - task: PublishBuildArtifacts@1
            displayName: 'Publicar JAR'
            inputs:
              PathtoPublish: 'build/libs'
              ArtifactName: 'cinefinder-jar'
              publishLocation: 'Container'

  - stage: Approval
    displayName: 'Aprovação manual'
    dependsOn: CI
    jobs:
      - job: WaitApproval
        pool: server
        steps:
          - task: ManualValidation@0
            displayName: 'Aguardar aprovador'
            inputs:
              notifyUsers: ''
              instructions: 'Revise o CI e aprove o deploy na VM Azure (vm-cinefinder-api).'

  - stage: CD
    displayName: 'CD - Deploy na VM'
    dependsOn: Approval
    jobs:
      - deployment: DeployVM
        displayName: 'Deploy Docker na VM'
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: cinefinder-jar
                  displayName: 'Baixar JAR do CI'

                - task: CopyFilesOverSSH@0
                  displayName: 'Enviar JAR para VM'
                  inputs:
                    sshEndpoint: 'vm-cinefinder-ssh'
                    sourceFolder: '$(Pipeline.Workspace)/cinefinder-jar'
                    contents: '**/*.jar'
                    targetFolder: '/home/azureuser/cinefinder-deploy/libs'
                    cleanTargetFolder: true
                    failOnEmptySource: true

                - task: SSH@0
                  displayName: 'Atualizar app na VM'
                  inputs:
                    sshEndpoint: 'vm-cinefinder-ssh'
                    runOptions: 'inline'
                    failOnStdErr: false
                    inline: |
                      set -e
                      DEPLOY_PATH="/home/azureuser/cinefinder-devops"
                      DEPLOY_LIBS="/home/azureuser/cinefinder-deploy/libs"
                      if [ ! -d "$DEPLOY_PATH" ]; then
                        git clone https://github.com/matheusmariotto1206/cinefinder-devops.git "$DEPLOY_PATH"
                      fi
                      cd "$DEPLOY_PATH"
                      git pull origin main 2>&1
                      mkdir -p build/libs
                      JAR_FILE=$(ls -1 "$DEPLOY_LIBS"/*.jar 2>/dev/null | grep -v plain | head -1)
                      if [ -z "$JAR_FILE" ]; then
                        echo "ERRO: nenhum JAR em $DEPLOY_LIBS"
                        ls -la "$DEPLOY_LIBS" || true
                        exit 1
                      fi
                      echo "Usando JAR: $JAR_FILE"
                      cp -f "$JAR_FILE" build/libs/app.jar
                      docker build -f Dockerfile.runtime -t cinefinder . 2>&1
                      docker rm -f cinefinder || true
                      docker run -d -p 8080:8080 \
                        -e SPRING_DATASOURCE_URL="$(SPRING_DATASOURCE_URL)" \
                        -e SPRING_DATASOURCE_USERNAME="$(SPRING_DATASOURCE_USERNAME)" \
                        -e SPRING_DATASOURCE_PASSWORD="$(SPRING_DATASOURCE_PASSWORD)" \
                        -e SPRING_DATASOURCE_DRIVER_CLASS_NAME=oracle.jdbc.OracleDriver \
                        -e SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.OracleDialect \
                        -e SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=2 \
                        -e SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=1 \
                        -e SPRING_FLYWAY_ENABLED=false \
                        --name cinefinder cinefinder
